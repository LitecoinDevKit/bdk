# Ignored advisories. Kept in sync by hand with the `[advisories].ignore` list
# in deny.toml; the reasoning and exit conditions are in docs/SUPPLY_CHAIN.md.
#
# None of these are on a bdk_mweb code path: zip is a build-dependency of a
# test-only downloader the fork never enables, and bincode arrives through
# bdk_file_store, which bdk_mweb uses only in the persist_filestore test.
[advisories]
ignore = [
    # zip 0.6.6, build-dependency of corepc-node via the optional Bitcoin Core
    # downloader in electrsd (bdk_testenv dev-dep). Never enabled by the fork,
    # never compiled, never shipped. Clears when corepc-node moves off zip 0.6
    # and electrsd picks that up.
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # bincode unmaintained, via bdk_file_store. An unmaintained notice, not a
    # vulnerability. Clears when file_store changes its encoding.
    "RUSTSEC-2025-0141",
]
